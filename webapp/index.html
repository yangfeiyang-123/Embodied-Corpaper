              ${COMMENT_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}
            </select>
            <textarea id="comment-content" placeholder="记录问题、补充链接、复现过程或结论讨论..."></textarea>
            <div><button class="btn btn-primary btn-sm" onclick="app.addComment('${paperId}')">发布评论</button></div>
          </div>
          ${topLevel.length ? topLevel.map(c => this.renderComment(c, repliesByParent, paperId, 0)).join('') : '<p class="comment-meta">暂无讨论。</p>'}
        </div>
      </div>
    `;
  },

  renderComment(comment, repliesByParent, paperId, depth = 0) {
    const replies = repliesByParent[comment.id] || [];
    const replyClass = depth > 0 ? ' reply' : '';
    const indent = depth > 6 ? ' style="margin-left:24px;"' : '';
    return `
      <div class="comment-item${replyClass}"${indent}>
        <div class="comment-meta">
          <strong>${this.escape(comment.author || '匿名')}</strong>
          · ${this.escape(comment.type || '其他')}
          · ${this.formatChinaTime(comment.created_at)}
        </div>
        <div class="comment-content markdown-body">${renderMarkdown(comment.content)}</div>
        <div class="comment-actions">
          <button class="btn btn-secondary btn-sm" onclick="app.showReplyForm('${comment.id}')">回复</button>
          <button class="btn btn-secondary btn-sm" onclick="app.removeComment('${paperId}', '${comment.id}')">删除</button>
        </div>
        <div id="reply-form-${comment.id}"></div>
        ${replies.map(reply => this.renderComment(reply, repliesByParent, paperId, depth + 1)).join('')}
      </div>
    `;
  },

  async loadComments(paperId) {
    const target = document.getElementById('comments-section');
    try {
      const data = await apiGet('/api/papers/' + paperId + '/comments');
      this.commentsByPaper[paperId] = data.comments || [];
      if (target) target.innerHTML = this.renderCommentsSection(paperId);
    } catch(e) {
      if (target) target.innerHTML = '<div class="comments-wrap"><p class="comment-meta">讨论加载失败：' + this.escape(e.message) + '</p></div>';
    }
  },

  async addComment(paperId, parentId = '') {
    const actor = this.getMemberName(true);
    const contentEl = parentId ? document.getElementById('reply-content-' + parentId) : document.getElementById('comment-content');
    const typeEl = parentId ? document.getElementById('reply-type-' + parentId) : document.getElementById('comment-type');
    const content = contentEl?.value.trim() || '';
    if (!content) {
      alert('请先填写评论内容。');
      return;
    }
    try {
      await apiPost('/api/papers/' + paperId + '/comments', {
        author: actor,
        type: typeEl?.value || '其他',
        content,
        parent_id: parentId
      });
      await this.loadComments(paperId);
    } catch(e) {
      alert('评论发布失败：' + e.message);
    }
  },

  showReplyForm(commentId) {
    const holder = document.getElementById('reply-form-' + commentId);
    if (!holder) return;
    const paperId = this.editingId;
    holder.innerHTML = `
      <div class="comment-form">
        <select id="reply-type-${commentId}">
          ${COMMENT_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}
        </select>
        <textarea id="reply-content-${commentId}" placeholder="回复这条讨论..."></textarea>
        <div>
          <button class="btn btn-primary btn-sm" onclick="app.addComment('${paperId}', '${commentId}')">发布回复</button>
          <button class="btn btn-secondary btn-sm" onclick="document.getElementById('reply-form-${commentId}').innerHTML=''">取消</button>
        </div>
      </div>
    `;
  },

  async removeComment(paperId, commentId) {
    if (!confirm('确定要删除这条讨论吗？')) return;
    try {
      await apiDelete('/api/comments/' + commentId);
      await this.loadComments(paperId);
    } catch(e) {
      alert('删除讨论失败：' + e.message);
    }
  },

  renderRadar(p) {
    const ctx = document.getElementById('radar-chart');
    if (!ctx) return;
    if (this.chartInstance) { this.chartInstance.destroy(); }
    this.chartInstance = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: ['相关性','新颖性','证据强度','启发性','可复现性'],
        datasets: [{
          label: '评分',
          data: [p.relevance||0, p.novelty||0, p.evidence||0, p.inspiration||0, p.reproducibility||0],
          backgroundColor: 'rgba(59,130,246,0.2)',
          borderColor: 'rgba(59,130,246,0.8)',
          pointBackgroundColor: 'rgba(59,130,246,1)',
          borderWidth: 2,
          pointRadius: 3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          r: {
            min: 0, max: 5,
            ticks: { stepSize: 1, font: {size: 10} },
            pointLabels: { font: {size: 11} }
          }
        },
        plugins: { legend: { display: false } }
      }
    });
  },

  // ===================== Editor =====================
  openEditor(id, draft = null) {
    const isEdit = !!id;
    let p = isEdit ? this.papers.find(x=>x.id===id) : (draft ? { ...createEmptyPaper(), ...draft } : createEmptyPaper());
    if (isEdit && draft && p) p = this.mergePdfDraftIntoPaper(p, draft);
    if (!p) p = createEmptyPaper();
    if (isEdit) this.editingId = id;
    else this.editingId = null;
    this.modalMode = 'edit';
    this.formDirty = false;
    this.metadataCandidates = [];

    document.getElementById('modal-title').textContent = isEdit ? '编辑文献' : '新增文献';
    document.getElementById('modal-body').innerHTML = this.renderEditorForm(p);
    document.getElementById('modal-actions').innerHTML = `
      <span class="save-status" id="save-status">未修改</span>
      <button class="btn btn-secondary" onclick="app.closeModal()">取消</button>
      <button class="btn btn-primary" id="save-button" onclick="app.savePaper()">保存</button>
    `;
    document.getElementById('modal').classList.add('open');
    this.initialFormSnapshot = this.getFormSnapshot();
    this.attachFormDirtyTracking();
    this.refreshMarkdownPreviews();
  },

  openTodoEditor(id, draft = null) {
    const isEdit = !!id;
    let p = isEdit ? this.todos.find(x=>x.id===id) : (draft ? { ...createEmptyPaper(), ...draft } : createEmptyPaper());
    if (isEdit && draft && p) p = this.mergePdfDraftIntoPaper(p, draft);
    if (!p) p = createEmptyPaper();
    if (!isEdit) {
      p.status = '未读';
      p.recorder = this.getMemberName(false) || this.currentUser || p.recorder || '';
      p.created_by = this.currentUser || p.created_by || '';
      p.updated_by = this.currentUser || p.updated_by || '';
    }
    this.editingId = isEdit ? id : null;
    this.modalMode = 'todo-edit';
    this.formDirty = false;
    this.metadataCandidates = [];

    document.getElementById('modal-title').textContent = isEdit ? '编辑待办论文' : '新增待办论文';
    document.getElementById('modal-body').innerHTML = this.renderEditorForm(p);
    const returnButton = isEdit && this.readerReturnState?.scope === 'todo' && this.readerReturnState?.id === id
      ? '<button class="btn btn-secondary" onclick="app.returnToReaderPreview()">返回阅读</button>'
      : '';
    document.getElementById('modal-actions').innerHTML = `
      <span class="save-status" id="save-status">未修改</span>
      ${returnButton}
      <button class="btn btn-secondary" onclick="app.closeModal()">取消</button>
      <button class="btn btn-secondary" id="save-button" onclick="app.saveTodo()">保存到待办</button>
      <button class="btn btn-primary" onclick="app.saveAndPublishTodo()">推送到文献库</button>
    `;
    document.getElementById('modal').classList.add('open');
    this.initialFormSnapshot = this.getFormSnapshot();
    this.attachFormDirtyTracking();
    this.refreshMarkdownPreviews();
  },

  renderEditorForm(p) {
    const sections = ['basic','paper','metadata','content','method','experiment','results','innovation','thinking'];
    const defaultOpenSections = new Set(['basic', 'paper']);
    let html = `
      <details class="editor-section" open>
        <summary>快速识别</summary>
        <div class="editor-section-body">
        <div class="identify-panel">
          <div class="identify-row">
            <input type="text" id="metadata-query" placeholder="粘贴 arXiv / DOI / OpenReview / 论文标题">
            <button class="btn btn-primary btn-sm" type="button" onclick="app.identifyMetadata()">识别</button>
            <button class="btn btn-secondary btn-sm" type="button" onclick="app.clearMetadataResult()">清空</button>
          </div>
          <div class="metadata-results" id="metadata-results"></div>
        </div>
        </div>
      </details>
      <input type="hidden" id="field-metadata_source" value="${this.escape(p.metadata_source || '')}">
      <input type="hidden" id="field-metadata_checked_at" value="${this.escape(p.metadata_checked_at || '')}">
      <input type="hidden" id="field-citation_source" value="${this.escape(p.citation_source || '')}">
    `;

    // Score section at top
    html += `<details class="editor-section" open>
      <summary>五维评分（自动计算综合评分）</summary>
      <div class="editor-section-body">
      <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;">
        <div class="score-inputs">
          ${Object.entries(RATING_LABELS).map(([key,label])=>`
            <div class="score-input">
              <label>${label}</label>
              <input type="number" id="score-${key}" min="1" max="5" step="1" value="${p[key]||3}" oninput="app.updateAutoScore()">
            </div>
          `).join('')}
        </div>
        <div style="text-align:center;min-width:80px;">
          <div class="score-display" id="auto-score" style="font-size:28px;">${computeScore(p)}</div>
          <div style="font-size:11px;color:var(--text-secondary);">综合评分</div>
        </div>
      </div>
      </div>
    </details>`;

    sections.forEach(sec => {
      const fields = FIELDS_DEF.filter(f => f.section === sec);
      if (!fields.length) return;
      html += `<details class="editor-section" ${defaultOpenSections.has(sec) ? 'open' : ''}>
        <summary>${SECTION_TITLES[sec]}</summary>
        <div class="editor-section-body"><div class="form-grid">`;
      fields.forEach(f => {
        const val = this.escape(p[f.key] || '');
        let input = '';
        if (f.type === 'select') {
          input = `<select id="field-${f.key}">${f.options.map(o=>`<option value="${o}" ${p[f.key]===o?'selected':''}>${o}</option>`).join('')}</select>`;
        } else if (f.type === 'textarea') {
          input = this.renderMarkdownField(f, val, 'textarea');
        } else if (f.type === 'date') {
          input = `<input type="date" id="field-${f.key}" value="${val}">`;
        } else if (f.type === 'number') {
          input = `<input type="number" id="field-${f.key}" min="0" step="1" value="${val}">`;
        } else {
          input = this.renderMarkdownField(f, val, 'input');
        }
        html += `<div class="form-field ${f.full?'full':''}"><label>${f.label}</label>${input}</div>`;
      });
      html += '</div></div></details>';
    });

    // Category selector
    html += `<details class="editor-section" open>
      <summary>分类</summary>
      <div class="editor-section-body">
      <div class="form-field full"><label>研究方向（可多选）</label>
      <div class="checkbox-grid">
        ${CATEGORIES.map(c=>`
          <label class="checkbox-card">
            <input type="checkbox" name="field-categories" value="${this.escape(c)}" ${getPaperCategories(p).includes(c)?'checked':''}>
            <span>${this.escape(c)}</span>
          </label>
        `).join('')}
      </div>
      <div class="field-hint">第一项选中的分类会作为主分类；侧边栏统计会把多分类论文计入每个相关方向。</div>
      </div>
      <div class="form-field full"><label>标签</label>
        ${this.renderMarkdownField({ key: 'tags', label: '标签' }, this.escape(getPaperTags(p).join(', ')), 'input')}
        <div class="field-hint">用逗号、分号或换行分隔，用于跨分类检索。</div>
      </div>
      </div>
    </details>`;

    return html;
  },

  renderMarkdownField(field, value, kind) {
    const modeLabel = '<button class="markdown-mode-toggle" type="button" onclick="app.toggleMarkdownMode(\'' + field.key + '\', event)">预览</button>';
    const rendered = `<div class="markdown-renderer markdown-body" id="markdown-render-${field.key}" onclick="app.toggleMarkdownMode('${field.key}', event)"></div>`;
    if (kind === 'textarea') {
      return `<div class="markdown-field textarea" id="markdown-field-${field.key}"><textarea id="field-${field.key}" class="markdown-source" data-markdown-field="${field.key}" rows="${field.rows || 5}" placeholder="${field.label}...">${value}</textarea>${rendered}${modeLabel}</div>`;
    }
    return `<div class="markdown-field input" id="markdown-field-${field.key}"><input type="text" id="field-${field.key}" class="markdown-source" data-markdown-field="${field.key}" value="${value}" placeholder="${field.label}">${rendered}${modeLabel}</div>`;
  },

  updateMarkdownPreview(fieldKey) {
    const field = document.getElementById('field-' + fieldKey);
    const body = document.getElementById('markdown-render-' + fieldKey);
    if (!field || !body) return;
    const value = field.value.trim();
    body.innerHTML = value ? renderMarkdown(value) : '<span class="markdown-empty">空白</span>';
  },

  refreshMarkdownPreviews() {
    document.querySelectorAll('[data-markdown-field]').forEach(el => {
      this.updateMarkdownPreview(el.dataset.markdownField);
    });
  },

  toggleMarkdownMode(fieldKey, event) {
    if (event?.target?.closest?.('a')) return;
    if (event) event.preventDefault();
    const shell = document.getElementById('markdown-field-' + fieldKey);
    const field = document.getElementById('field-' + fieldKey);
    if (!shell || !field) return;
    const nextPreview = !shell.classList.contains('previewing');
    this.updateMarkdownPreview(fieldKey);
    shell.classList.toggle('previewing', nextPreview);
    const btn = shell.querySelector('.markdown-mode-toggle');
    if (btn) {
      btn.textContent = nextPreview ? '编辑' : '预览';
      btn.setAttribute('aria-pressed', String(nextPreview));
    }
    if (!nextPreview) setTimeout(() => field.focus(), 0);
  },

  async identifyMetadata() {
    const input = document.getElementById('metadata-query');
    const resultsEl = document.getElementById('metadata-results');
    const query = input?.value.trim() || '';
    if (!query) {
      alert('请先输入论文链接、DOI、OpenReview ID 或标题。');
      return;
    }
    if (resultsEl) resultsEl.innerHTML = '<div class="comment-meta">识别中...</div>';
    try {
      const data = await apiPost('/api/metadata/search', { query, bypassCache: true });
      this.metadataCandidates = data.candidates || [];
      if (resultsEl) resultsEl.innerHTML = this.renderMetadataCandidates(data);
    } catch(e) {
      if (resultsEl) resultsEl.innerHTML = `<div class="duplicate-warning">识别失败：${this.escape(e.message)}</div>`;
    }
  },

  clearMetadataResult() {
    this.metadataCandidates = [];
    const input = document.getElementById('metadata-query');
    const resultsEl = document.getElementById('metadata-results');
    if (input) input.value = '';
    if (resultsEl) resultsEl.innerHTML = '';
  },

  renderMetadataCandidates(data) {
    const candidates = data.candidates || [];
    if (!candidates.length) {
      return `<div class="comment-meta">${data.localMode ? '本地模式不执行外部识别。' : '没有找到可用候选。'}</div>`;
    }
    return candidates.map((candidate, index) => {
      const duplicate = candidate.duplicate || { status: 'none' };
      const citationCount = getCitationDisplay(candidate);
      const publishedAt = (candidate.published_at || '').slice(0, 10);
      return `
        <div class="metadata-card">
          <div class="metadata-card-title">${this.escape(candidate.title || '未命名候选')}</div>
          <div class="metadata-card-meta">
            ${this.escape([candidate.authors, candidate.year, candidate.venue, candidate.metadata_source || candidate.source].filter(Boolean).join(' · '))}
            ${publishedAt ? `<br>发表时间: ${this.escape(publishedAt)}` : ''}
            ${citationCount ? `<br>引用量: ${citationCount}${candidate.citation_source ? ` (${this.escape(candidate.citation_source)})` : ''}` : ''}
            ${candidate.doi ? `<br>DOI: ${this.escape(candidate.doi)}` : ''}
            ${candidate.arxiv_id ? `<br>arXiv: ${this.escape(candidate.arxiv_id)}` : ''}
            ${candidate.openreview_id ? `<br>OpenReview: ${this.escape(candidate.openreview_id)}` : ''}
          </div>
          ${candidate.abstract ? `<div class="metadata-card-meta" style="margin-top:6px;">${this.escape(candidate.abstract).slice(0, 220)}${candidate.abstract.length > 220 ? '...' : ''}</div>` : ''}
          ${duplicate.status !== 'none' ? `<div class="duplicate-warning">${this.duplicateDescription(duplicate)}</div>` : ''}
          <div class="metadata-card-actions">
            <button class="btn btn-primary btn-sm" type="button" onclick="app.useMetadataCandidate(${index})">使用结果</button>
            ${duplicate.paper?.id ? `<button class="btn btn-secondary btn-sm" type="button" onclick="app.openDetail('${duplicate.paper.id}')">打开已有记录</button>` : ''}
            ${duplicate.paper?.id ? `<button class="btn btn-secondary btn-sm" type="button" onclick="app.mergeMetadataIntoExisting(${index}, '${duplicate.paper.id}')">合并到已有记录</button>` : ''}
          </div>
        </div>
      `;
    }).join('');
  },

  duplicateDescription(duplicate) {
    if (duplicate.status === 'definite') {
      return `可能已存在相同论文：${this.escape(duplicate.paper?.title || '未命名')}（匹配 ${this.escape(duplicate.reason)}）`;
    }
    if (duplicate.status === 'suspected') {
      return `疑似重复：${this.escape(duplicate.paper?.title || '未命名')}（标题相似度 ${duplicate.score || ''}）`;
    }
    return '';
  },

  useMetadataCandidate(index) {
    const candidate = this.metadataCandidates[index];
    if (!candidate) return;
    this.applyMetadataToForm(candidate, false);
    this.markFormDirty();
  },

  applyMetadataToForm(candidate, onlyFillBlank = true) {
    const values = {
      title: candidate.title,
      source: [candidate.year, candidate.venue || candidate.metadata_source || candidate.source].filter(Boolean).join(' / '),
      link: candidate.canonical_url || candidate.url,
      authors: [candidate.authors, candidate.institutions].filter(Boolean).join('\n'),
      abstract: candidate.abstract,
      doi: candidate.doi,
      arxiv_id: candidate.arxiv_id,
      openreview_id: candidate.openreview_id,
      published_at: (candidate.published_at || '').slice(0, 10),
      citation_count: formatCitationCount(candidate.citation_count),
      citation_source: candidate.citation_source,
      canonical_url: candidate.canonical_url || candidate.url,
      metadata_source: candidate.metadata_source || candidate.source,
      metadata_checked_at: new Date().toISOString()
    };
    for (const [key, value] of Object.entries(values)) {
      const el = document.getElementById('field-' + key);
      if (!el || !value) continue;
      if (!onlyFillBlank || !el.value.trim()) el.value = value;
    }
    this.refreshMarkdownPreviews();
  },

  async mergeMetadataIntoExisting(index, paperId) {
    const candidate = this.metadataCandidates[index];
    const existing = this.papers.find(p => p.id === paperId);
    if (!candidate || !existing) return;
    if (!confirm('只会合并事实元数据，不会覆盖评分、阅读笔记、分类、标签或讨论。继续吗？')) return;
    const actor = this.getMemberName(true);
    const merged = {
      ...existing,
      abstract: candidate.abstract || existing.abstract || '',
      doi: candidate.doi || existing.doi || '',
      arxiv_id: candidate.arxiv_id || existing.arxiv_id || '',
      openreview_id: candidate.openreview_id || existing.openreview_id || '',
      published_at: (candidate.published_at || existing.published_at || '').slice(0, 10),
      citation_count: formatCitationCount(candidate.citation_count) || existing.citation_count || 0,
      citation_source: candidate.citation_source || existing.citation_source || '',
      metadata_source: candidate.metadata_source || candidate.source || existing.metadata_source || '',
      metadata_checked_at: new Date().toISOString(),
      canonical_url: candidate.canonical_url || candidate.url || existing.canonical_url || '',
      title: existing.title || candidate.title || '',
      source: existing.source || [candidate.year, candidate.venue].filter(Boolean).join(' / '),
      link: existing.link || candidate.canonical_url || candidate.url || '',
      authors: existing.authors || [candidate.authors, candidate.institutions].filter(Boolean).join('\n'),
      updated_by: actor,
      _expected_updated_at: existing.updated_at || ''
    };
    try {
      const saved = await apiPut('/api/papers/' + paperId, merged);
      const idx = this.papers.findIndex(p => p.id === paperId);
      if (idx >= 0) this.papers[idx] = saved;
      this.saveData();
      alert('已合并到已有记录。');
      this.openDetail(paperId);
    } catch(e) {
      alert('合并失败：' + e.message);
    }
  },

  updateAutoScore() {
    const tmp = {
      relevance: parseFloat(document.getElementById('score-relevance').value)||0,
      novelty: parseFloat(document.getElementById('score-novelty').value)||0,
      evidence: parseFloat(document.getElementById('score-evidence').value)||0,
      inspiration: parseFloat(document.getElementById('score-inspiration').value)||0,
      reproducibility: parseFloat(document.getElementById('score-reproducibility').value)||0
    };
    const el = document.getElementById('auto-score');
    const oldVal = parseFloat(el.textContent) || 0;
    const newVal = computeScore(tmp);
    el.textContent = newVal;
    if (Math.abs(newVal - oldVal) > 0.01) {
      el.classList.add('pop');
      setTimeout(() => el.classList.remove('pop'), 250);
    }
  },

  getFormSnapshot() {
    const values = {};
    document.querySelectorAll('#modal-body input, #modal-body textarea, #modal-body select').forEach(el => {
      if (el.type === 'checkbox') values[el.name + ':' + el.value] = el.checked;
      else values[el.id || el.name] = el.value;
    });
    return JSON.stringify(values);
  },

  attachFormDirtyTracking() {
    document.querySelectorAll('#modal-body input, #modal-body textarea, #modal-body select').forEach(el => {
      el.addEventListener('input', () => {
        if (el.dataset.markdownField) this.updateMarkdownPreview(el.dataset.markdownField);
        this.markFormDirty();
      });
      el.addEventListener('change', () => {
        if (el.dataset.markdownField) this.updateMarkdownPreview(el.dataset.markdownField);
        this.markFormDirty();
      });
    });
  },

  markFormDirty() {
    if (this.modalMode !== 'edit' && this.modalMode !== 'todo-edit') return;
    this.formDirty = this.getFormSnapshot() !== this.initialFormSnapshot;
    this.setSaveStatus(this.formDirty ? '有未保存修改' : '未修改', this.formDirty ? 'dirty' : '');
  },

  setSaveStatus(text, state = '') {
    const el = document.getElementById('save-status');
    if (!el) return;
    el.className = `save-status ${state}`.trim();
    el.textContent = text;
  },

  getMemberName(required = false) {
    let name = this.currentUser || localStorage.getItem('embodied_member_name') || '';
    if (!name && required) {
      name = prompt('请输入你的姓名或昵称，用于记录是谁更新了文献：') || '';
      name = name.trim();
      if (name) localStorage.setItem('embodied_member_name', name);
    }
    return name;
  },

  showLogin() {
    document.getElementById('login-overlay').classList.remove('hidden');
    document.getElementById('login-username').focus();
  },

  switchLoginTab(tab) {
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('login-form-panel').style.display = tab === 'login' ? 'flex' : 'none';
    document.getElementById('register-form-panel').style.display = tab === 'register' ? 'flex' : 'none';
    document.getElementById('login-error').textContent = '';
    document.getElementById('register-error').textContent = '';
  },

  getAppPasswordFromLogin() {
    const loginPw = document.getElementById('login-app-password')?.value || '';
    const regPw = document.getElementById('register-app-password')?.value || '';
    return loginPw || regPw;
  },

  async doLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const appPassword = document.getElementById('login-app-password').value;
    const errorEl = document.getElementById('login-error');
    if (!username || !password) {
      errorEl.textContent = '请输入用户名和密码';
      return;
    }
    // Save app password if provided
    if (appPassword) {
      APP_PASSWORD = appPassword;
      localStorage.setItem('embodied_password', appPassword);
    }
    try {
      const resp = await fetch(API_BASE + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...apiHeaders() },
        body: JSON.stringify({ username, password })
      });
      const data = await resp.json();
      if (!resp.ok) {
        errorEl.textContent = data.error || '登录失败';
        return;
      }
      this.currentUser = data.username;
      CURRENT_USER = data.username;
      localStorage.setItem('embodied_username', data.username);
      document.getElementById('login-overlay').classList.add('hidden');
      this.updateUserUI();
      await this.init();
    } catch(e) {
      errorEl.textContent = '网络错误，请重试';
    }
  },

  async doRegister() {
    const username = document.getElementById('register-username').value.trim();
    const password = document.getElementById('register-password').value;
    const password2 = document.getElementById('register-password2').value;
    const appPassword = document.getElementById('register-app-password').value;
    const errorEl = document.getElementById('register-error');
    if (!username || !password) {
      errorEl.textContent = '请输入用户名和密码';
      return;
    }
    if (password !== password2) {
      errorEl.textContent = '两次输入的密码不一致';
      return;
    }
    // Save app password if provided
    if (appPassword) {
      APP_PASSWORD = appPassword;
      localStorage.setItem('embodied_password', appPassword);
    }
    try {
      const resp = await fetch(API_BASE + '/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...apiHeaders() },
        body: JSON.stringify({ username, password })
      });
      const data = await resp.json();
      if (!resp.ok) {
        errorEl.textContent = data.error || '注册失败';
        return;
      }
      errorEl.textContent = '注册成功，请登录';
      errorEl.style.color = 'var(--success)';
      setTimeout(() => {
        errorEl.style.color = '';
        this.switchLoginTab('login');
        document.getElementById('login-username').value = username;
      }, 800);
    } catch(e) {
      errorEl.textContent = '网络错误，请重试';
    }
  },

  updateUserUI() {
    const menu = document.getElementById('user-menu');
    const nameEl = document.getElementById('user-name');
    const avatarEl = document.getElementById('user-avatar');
    if (menu && nameEl && avatarEl && this.currentUser) {
      menu.style.display = 'inline-flex';
      nameEl.textContent = this.currentUser;
      avatarEl.textContent = this.currentUser.charAt(0).toUpperCase();
    }
  },

  showUserDropdown() {
    if (confirm(`当前用户：${this.currentUser}\n\n要退出登录吗？`)) {
      this.logout();
    }
  },

  logout() {
    this.currentUser = '';
    CURRENT_USER = '';
    localStorage.removeItem('embodied_username');
    location.reload();
  },

  readEditorFormIntoPaper(basePaper, isEdit, actor) {
    const p = { ...basePaper };
    ['relevance','novelty','evidence','inspiration','reproducibility'].forEach(k=>{
      const el = document.getElementById('score-'+k);
      if (el) p[k] = parseFloat(el.value) || 0;
    });

    FIELDS_DEF.forEach(f => {
      const el = document.getElementById('field-'+f.key);
      if (el) p[f.key] = el.value;
    });
    ['metadata_source','metadata_checked_at','citation_source'].forEach(k => {
      const el = document.getElementById('field-'+k);
      if (el) p[k] = el.value;
    });
    p.citation_count = parseInt(p.citation_count, 10) || 0;

    const categories = Array.from(document.querySelectorAll('input[name="field-categories"]:checked')).map(el => el.value);
    if (!categories.length) {
      return { ok: false, error: '请至少选择一个研究方向。' };
    }
    p.categories = categories;
    p.category = categories[0];
    p.tags = parseList(document.getElementById('field-tags')?.value || '');
    p.updated_by = actor;
    if (!p.created_by) p.created_by = actor;
    p._expected_updated_at = isEdit ? (basePaper.updated_at || '') : '';
    return { ok: true, paper: p };
  },

  async savePaper() {
    const isEdit = !!this.editingId;
    let p = isEdit ? this.papers.find(x=>x.id===this.editingId) : createEmptyPaper();
    if (!p) return;
    const actor = this.getMemberName(true);
    const saveBtn = document.getElementById('save-button');
    if (saveBtn) saveBtn.disabled = true;
    this.setSaveStatus('保存中...', 'saving');

    const readResult = this.readEditorFormIntoPaper(p, isEdit, actor);
    if (!readResult.ok) {
      alert(readResult.error);
      if (saveBtn) saveBtn.disabled = false;
      this.setSaveStatus('请选择分类', 'error');
      return;
    }
    p = readResult.paper;

    try {
      let saved;
      if (isEdit) {
        saved = await apiPut('/api/papers/' + p.id, p);
        const idx = this.papers.findIndex(x => x.id === p.id);
        if (idx >= 0) this.papers[idx] = saved;
      } else {
        saved = await apiPost('/api/papers', p);
        this.papers.unshift(saved);
      }
      this.saveData();
      this.formDirty = false;
      this.initialFormSnapshot = this.getFormSnapshot();
      this.setSaveStatus('已保存', 'saved');
      this.closeModal();
      this.render();
    } catch(e) {
      if (e.status === 409) {
        alert(e.message + '\n\n为避免覆盖他人修改，请关闭后重新打开这篇文献。');
        await this.loadData();
        this.saveData();
        this.render();
      } else {
        alert('保存失败: ' + e.message);
      }
      this.setSaveStatus('保存失败', 'error');
    } finally {
      if (saveBtn) saveBtn.disabled = false;
    }
  },

  async saveTodo(options = {}) {
    const isEdit = !!this.editingId;
    let p = isEdit ? this.todos.find(x=>x.id===this.editingId) : createEmptyPaper();
    if (!p) return null;
    const actor = this.getMemberName(false) || this.currentUser;
    const saveBtn = document.getElementById('save-button');
    if (saveBtn) saveBtn.disabled = true;
    this.setSaveStatus('保存中...', 'saving');

    const readResult = this.readEditorFormIntoPaper(p, isEdit, actor);
    if (!readResult.ok) {
      alert(readResult.error);
      if (saveBtn) saveBtn.disabled = false;
      this.setSaveStatus('请选择分类', 'error');
      return null;
    }
    p = readResult.paper;

    try {
      let saved;
      if (isEdit) {
        saved = await apiPut('/api/todos/' + p.id, p);
        const idx = this.todos.findIndex(x => x.id === p.id);
        if (idx >= 0) this.todos[idx] = saved;
      } else {
        saved = await apiPost('/api/todos', p);
        this.todos.unshift(saved);
        this.editingId = saved.id;
      }
      this.saveData();
      this.formDirty = false;
      this.initialFormSnapshot = this.getFormSnapshot();
      this.setSaveStatus('已保存到待办', 'saved');
      if (!options.keepOpen) {
        this.closeModal();
        this.render();
      }
      return saved;
    } catch(e) {
      alert('保存待办失败: ' + e.message);
      this.setSaveStatus('保存失败', 'error');
      return null;
    } finally {
      if (saveBtn) saveBtn.disabled = false;
    }
  },

  async saveAndPublishTodo() {
    const saved = await this.saveTodo({ keepOpen: true });
    if (!saved) return;
    await this.publishTodo(saved.id, { fromModal: true });
  },

  async publishTodo(id, options = {}) {
    const todo = this.todos.find(x => x.id === id);
    if (!todo) return;
    if (!options.fromModal && !confirm(`将「${todo.title || '未命名待办论文'}」推送到共享文献库，并从我的待办中移除。继续吗？`)) {
      return;
    }
    try {
      const actor = this.getMemberName(false) || this.currentUser;
      const saved = await apiPost('/api/todos/' + id + '/publish', { updated_by: actor });
      this.todos = this.todos.filter(x => x.id !== id);
      this.papers.unshift(saved);
      await this.movePdfRecord('todo', 'paper', id);
      this.saveData();
      if (options.fromModal) this.closeModal();
      this.currentView = 'list';
      this.currentCategory = 'all';
      this.renderSidebarNav();
      this.updateNavCounts();
      this.render();
      alert('已推送到文献库。');
    } catch(e) {
      alert('推送失败: ' + e.message);
    }
  },

  async deleteTodo(id) {
    const todo = this.todos.find(x => x.id === id);
    if (!todo) return;
    if (!confirm(`确定要删除待办「${todo.title || '未命名待办论文'}」吗？`)) return;
    try {
      await apiDelete('/api/todos/' + id);
      this.todos = this.todos.filter(x => x.id !== id);
      await this.deletePdfRecord('todo', id);
      this.saveData();
      this.render();
    } catch(e) {
      alert('删除待办失败: ' + e.message);
    }
  },

  // Delete confirmation
  pendingDeleteId: null,

  showDeleteConfirm(id) {
    const p = this.papers.find(x => x.id === id);
    const title = p ? (p.title || '未命名文献') : '';
    const bodyEl = document.getElementById('confirm-body');
    if (bodyEl) {
      bodyEl.innerHTML = `确定要删除 <strong>「${this.escape(title)}」</strong> 吗？<br>删除后将无法恢复，关联的评论也会被一并删除。`;
    }
    this.pendingDeleteId = id;
    document.getElementById('confirm-overlay').classList.add('open');
  },

  cancelDelete() {
    this.pendingDeleteId = null;
    document.getElementById('confirm-overlay').classList.remove('open');
  },

  async confirmDelete() {
    const id = this.pendingDeleteId;
    this.pendingDeleteId = null;
    document.getElementById('confirm-overlay').classList.remove('open');
    if (!id) return;
    try {
      await apiDelete('/api/papers/' + id);
      this.papers = this.papers.filter(p=>p.id!==id);
      await this.deletePdfRecord('paper', id);
      this.saveData();
      this.closeModal();
      this.render();
    } catch(e) {
      alert('删除失败: ' + e.message);
    }
  },

  async deletePaper(id) {
    this.showDeleteConfirm(id);
  },

  async toggleFavorite(id) {
    const p = this.papers.find(x => x.id === id);
    if (!p) return;
    const next = p.favorite === '是' ? '否' : '是';
    try {
      const result = await apiPost('/api/papers/' + id + '/favorite', { favorite: next === '是' });
      const idx = this.papers.findIndex(x => x.id === id);
      if (idx >= 0) this.papers[idx].favorite = result.favorite || next;
      this.saveData();
      // Re-render if modal is open showing this paper
      if (this.editingId === id && this.modalMode === 'detail') {
        const updated = { ...this.papers[idx] };
        document.getElementById('modal-body').innerHTML = this.renderDetailBody(updated);
        setTimeout(() => this.renderRadar(updated), 150);
        this.loadComments(id);
      }
      this.render();
    } catch(e) {
      alert('收藏操作失败: ' + e.message);
    }
  },

  promptPassword() {
    const pw = prompt('此系统已启用密码保护，请输入访问密码：');
    if (pw !== null) {
      APP_PASSWORD = pw;
      localStorage.setItem('embodied_password', pw);
      this.init();
    }
  },

  closeModal() {
    if ((this.modalMode === 'edit' || this.modalMode === 'todo-edit') && this.formDirty) {
      if (!confirm('当前表单有未保存修改，确定要关闭吗？')) return;
    }
    if (this.readerReturnState && ['detail', 'edit', 'todo-edit'].includes(this.modalMode)) {
      this.readerReturnState = null;
    }
    document.getElementById('modal').classList.remove('open');
    if (this.chartInstance) { this.chartInstance.destroy(); this.chartInstance = null; }
    this.editingId = null;
    this.modalMode = 'none';
    this.formDirty = false;
    this.initialFormSnapshot = '';
  },

  // ===================== PDF Reader =====================
  async openPdfReader(scope, id, event, options = {}) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }
    try {
      const restoreState = options.restoreState || null;
      if (!window.pdfjsLib) {
        alert('PDF 阅读器加载失败，请刷新页面后重试。');
        return;
      }
      const record = await this.getPdfRecord(scope, id).catch(() => null);
      if (!record) {
        alert('这张卡片还没有绑定 PDF。请先拖入或导入 PDF 文件。');
        return;
      }
      const paper = scope === 'todo'
        ? this.todos.find(item => item.id === id)
        : this.papers.find(item => item.id === id);
      if (!paper) {
        alert('没有找到对应的文献记录。');
        return;
      }

      this.currentReader = {
        scope,
        id,
        paper,
        record,
        annotations: Array.isArray(record.annotations) ? [...record.annotations] : []
      };
      this.readerUndoStack = [];
      this.readerRedoStack = [];
      this.lastSelectionHighlightKey = '';
      this.currentPdfTextPages = [];
      this.readerOutlineItems = [];
      this.readerOutlineCollapsed = Boolean(restoreState?.outlineCollapsed);
      this.readerOutlineExpanded = new Set();
      this.readerRestoreState = restoreState;
      this.pendingHighlightSelection = null;
      this.hideHighlightPopover(true);
      this.updateReaderHistoryButtons();
      document.getElementById('reader-title').textContent = '';
      document.getElementById('reader-record').innerHTML = this.renderReaderRecord(scope, paper, record);
      this.setReaderOutlinePanelCollapsed(this.readerOutlineCollapsed);
      this.renderReaderOutlineLoading();
      this.setReaderView('pdf');
      document.getElementById('reader-overlay').classList.add('open');
      document.getElementById('pdf-scroll').innerHTML = '<div class="reader-empty">正在读取 PDF 文件...</div>';

      const blob = await apiGetBlob(`/api/pdfs/${encodeURIComponent(scope)}/${encodeURIComponent(id)}/file`);
      this.currentReader.record = { ...record, blob };
      await this.renderPdfDocument(blob, restoreState
        ? { scale: restoreState.scale, anchor: restoreState.anchor }
        : { fitWidth: true });
      this.readerRestoreState = null;
    } catch (error) {
      this.readerRestoreState = null;
      console.error('Failed to open PDF reader:', error);
      document.getElementById('reader-overlay').classList.add('open');
      document.getElementById('pdf-scroll').innerHTML = `<div class="reader-empty">PDF 打开失败：${this.escape(error.message || '未知错误')}</div>`;
    }
  },

  renderReaderRecord(scope, p, record) {
    const categories = getPaperCategories(p);
    const tags = getPaperTags(p);
    const score = computeScore(p);
    const publishedAt = getPublicationDate(p) || '-';
    const citationCount = getCitationDisplay(p) || '-';
    const editCall = scope === 'todo'
      ? `app.closePdfReader(); app.openTodoEditor('${this.escapeJs(p.id)}')`
      : `app.closePdfReader(); app.openEditor('${this.escapeJs(p.id)}')`;
    const s = (label, value) => value ? `<div class="reader-record-section"><h4>${label}</h4><div class="markdown-body">${renderMarkdown(value)}</div></div>` : '';
    return `
      <div class="reader-record-grid">
        <div class="reader-record-section">
          <h3>${this.escape(p.title || '未命名文献')}</h3>
          <p>
            <strong>分类：</strong>${categories.map(c => this.escape(c)).join(' / ') || '-'}<br>
            <strong>标签：</strong>${tags.length ? tags.map(t => '#' + this.escape(t)).join(' ') : '-'}<br>
            <strong>状态：</strong>${this.escape(p.status || (scope === 'todo' ? '未读' : '深读中'))}
            &nbsp;|&nbsp; <strong>综合评分：</strong>${score}<br>
            <strong>发表时间：</strong>${this.escape(p.published_at || publishedAt)}
            &nbsp;|&nbsp; <strong>引用量：</strong>${citationCount}<br>
            <strong>PDF：</strong>${this.escape(record.fileName || 'PDF')}
            &nbsp;(${this.formatFileSize(record.size || 0)})
          </p>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
            <button class="btn btn-secondary btn-sm" onclick="${editCall}">编辑记录</button>
            ${p.link ? `<a class="btn btn-secondary btn-sm" href="${this.escape(p.link)}" target="_blank">外部链接</a>` : ''}
          </div>
        </div>
        <div class="reader-record-section">
          <h4>作者与来源</h4>
          <p>${this.escape(p.authors || '-')}<br>${this.escape(p.source || '-')}</p>
          <h4 style="margin-top:10px;">元数据</h4>
          <p>DOI：${this.escape(p.doi || '-')}<br>arXiv：${this.escape(p.arxiv_id || '-')}</p>
        </div>
        ${s('一句话定位', p.oneSentence)}
        ${s('摘要', p.abstract)}
      </div>
    `;
  },

  async renderReaderOutline() {
    const panel = document.getElementById('reader-outline-panel');
    if (!panel) return;
    this.readerOutlineItems = [];
    if (!this.currentPdfDoc) {
      this.renderReaderOutlineShell('<div class="reader-outline-empty">尚未加载 PDF。</div>');
      return;
    }
    const outline = await this.currentPdfDoc.getOutline().catch(() => null);
    if (!Array.isArray(outline) || !outline.length) {
      this.renderReaderOutlineShell('<div class="reader-outline-empty">这个 PDF 没有内置大纲。</div>');
      return;
    }

    const build = (items, level = 0) => items.map(item => {
      const id = `outline-${this.readerOutlineItems.length}`;
      const node = {
        id,
        title: item.title || `章节 ${this.readerOutlineItems.length + 1}`,
        dest: item.dest || null,
        url: item.url || '',
        level,
        children: []
      };
      this.readerOutlineItems.push(node);
      node.children = Array.isArray(item.items) && item.items.length ? build(item.items, level + 1) : [];
      if (node.children.length && !this.readerRestoreState?.outlineExpanded) this.readerOutlineExpanded.add(id);
      return node;
    });
    const tree = build(outline);
    if (Array.isArray(this.readerRestoreState?.outlineExpanded)) {
      this.readerOutlineExpanded = new Set(this.readerRestoreState.outlineExpanded);
    }
    this.renderReaderOutlineTree(tree);
  },

  renderReaderOutlineLoading() {
    this.renderReaderOutlineShell('<div class="reader-outline-empty">正在读取 PDF 大纲...</div>');
  },

  renderReaderOutlineShell(content = '') {
    const panel = document.getElementById('reader-outline-panel');
    if (!panel) return;
    panel.classList.toggle('collapsed', this.readerOutlineCollapsed);
    panel.innerHTML = `
      <div class="reader-outline-title">
        <span class="reader-outline-label">大纲</span>
        <button class="reader-outline-toggle" onclick="app.toggleReaderOutlinePanel()" title="${this.readerOutlineCollapsed ? '展开大纲' : '收起大纲'}">
          ${this.readerOutlineCollapsed ? '›' : '‹'}
        </button>
      </div>
      <div class="reader-outline-content">${content}</div>
    `;
  },

  renderReaderOutlineTree(tree = null) {
    const roots = tree || this.readerOutlineItems.filter(item => item.level === 0);
    const rows = [];
    const renderNode = node => {
      const hasChildren = node.children.length > 0;
      const expanded = this.readerOutlineExpanded.has(node.id);
      rows.push(`
        <div class="reader-outline-row" style="padding-left:${node.level * 12}px">
          ${hasChildren
            ? `<button class="reader-outline-disclosure" onclick="app.toggleReaderOutlineNode('${this.escapeJs(node.id)}', event)" title="${expanded ? '收起章节' : '展开章节'}">${expanded ? '▾' : '▸'}</button>`
            : '<span class="reader-outline-disclosure"></span>'}
          <button class="reader-outline-item" onclick="app.jumpToReaderOutline('${this.escapeJs(node.id)}')">
            ${this.escape(node.title)}
          </button>
        </div>
      `);
      if (hasChildren && expanded) node.children.forEach(renderNode);
    };
    roots.forEach(renderNode);
    this.renderReaderOutlineShell(rows.join(''));
  },

  toggleReaderOutlinePanel() {
    this.setReaderOutlinePanelCollapsed(!this.readerOutlineCollapsed);
  },

  setReaderOutlinePanelCollapsed(collapsed) {
    this.readerOutlineCollapsed = Boolean(collapsed);
    const panel = document.getElementById('reader-outline-panel');
    if (panel) {
      panel.classList.toggle('collapsed', this.readerOutlineCollapsed);
      const toggle = panel.querySelector('.reader-outline-toggle');
      if (toggle) {
        toggle.textContent = this.readerOutlineCollapsed ? '›' : '‹';
        toggle.title = this.readerOutlineCollapsed ? '展开大纲' : '收起大纲';
      }
    }
  },

  toggleReaderOutlineNode(id, event) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }
    if (this.readerOutlineExpanded.has(id)) {
      this.readerOutlineExpanded.delete(id);
    } else {
      this.readerOutlineExpanded.add(id);
    }
    this.renderReaderOutlineTree();
  },

  async jumpToReaderOutline(id) {
    const item = this.readerOutlineItems.find(node => node.id === id);
    if (!item) return;
    if (item.url) {
      window.open(item.url, '_blank', 'noopener,noreferrer');
      return;
    }
    if (item.dest) await this.jumpToPdfDestination(item.dest);
  },

  async renderPdfDocument(blob, options = {}) {
    const scroll = document.getElementById('pdf-scroll');
    scroll.innerHTML = '<div class="reader-empty">正在加载 PDF...</div>';
    try {
      const data = await blob.arrayBuffer();
      this.currentPdfDoc = await window.pdfjsLib.getDocument({ data }).promise;
      this.currentPdfTextPages = [];
      await this.renderReaderOutline();
      await this.renderCurrentPdfPages(options);
    } catch (error) {
      console.error(error);
      scroll.innerHTML = '<div class="reader-empty">PDF 加载失败。请重新导入文件后再试。</div>';
    }
  },

  async renderCurrentPdfPages(options = {}) {
    if (!this.currentPdfDoc) return;
    const token = ++this.readerRenderToken;
    const scroll = document.getElementById('pdf-scroll');
    const anchor = options.anchor || (options.preserveAnchor ? this.getReaderScrollAnchor() : null);
    if (Number.isFinite(options.scale)) {
      this.currentPdfScale = Math.max(0.45, Math.min(4, options.scale));
    }
    if (options.fitWidth || options.fitPage) {
      const firstPage = await this.currentPdfDoc.getPage(1);
      if (token !== this.readerRenderToken) return;
      const baseViewport = firstPage.getViewport({ scale: 1 });
      const scrollStyle = window.getComputedStyle(scroll);
      const horizontalPadding = (parseFloat(scrollStyle.paddingLeft) || 0) + (parseFloat(scrollStyle.paddingRight) || 0);
      const availableWidth = Math.max(360, scroll.clientWidth - horizontalPadding - 16);
      const widthScale = availableWidth / baseViewport.width;
      if (options.fitPage) {
        const availableHeight = Math.max(420, scroll.clientHeight - 36);
        const heightScale = availableHeight / baseViewport.height;
        this.currentPdfScale = Math.max(0.45, Math.min(4, Math.min(widthScale, heightScale)));
      } else {
        this.currentPdfScale = Math.max(0.5, Math.min(4, widthScale));
      }
    }
    this.updateReaderScaleDisplay();
    const textPages = [];
    const host = document.createElement('div');
    host.className = 'pdf-pages';
    host.id = 'pdf-pages';
    host.style.visibility = 'hidden';
    for (let pageNumber = 1; pageNumber <= this.currentPdfDoc.numPages; pageNumber += 1) {
      await this.renderPdfPage(pageNumber, host, textPages);
      if (token !== this.readerRenderToken) return;
    }
    if (token !== this.readerRenderToken) return;
    scroll.replaceChildren(host);
    this.currentPdfTextPages = textPages;
    this.renderedPdfScale = this.currentPdfScale;
    if (anchor) this.restoreReaderScrollAnchor(anchor);
    scroll.classList.remove('zoom-preview');
    scroll.style.removeProperty('--pdf-preview-scale');
    scroll.style.removeProperty('--pdf-preview-origin');
    requestAnimationFrame(() => {
      host.style.visibility = '';
    });
  },

  async renderPdfPage(pageNumber, scroll, textPages = this.currentPdfTextPages) {
    const page = await this.currentPdfDoc.getPage(pageNumber);
    const viewport = page.getViewport({ scale: this.currentPdfScale });
    const pageEl = document.createElement('div');
    pageEl.className = 'pdf-page';
    pageEl.dataset.page = String(pageNumber);
    pageEl.style.width = `${viewport.width}px`;
    pageEl.style.height = `${viewport.height}px`;

    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    canvas.style.width = `${viewport.width}px`;
    canvas.style.height = `${viewport.height}px`;
    pageEl.appendChild(canvas);

    const annotationLayer = document.createElement('div');
    annotationLayer.className = 'annotation-layer';
    pageEl.appendChild(annotationLayer);

    const layer = document.createElement('div');
    layer.className = 'highlight-layer';
    pageEl.appendChild(layer);

    const textLayer = document.createElement('div');
    textLayer.className = 'text-layer';
    pageEl.appendChild(textLayer);
    textLayer.addEventListener('mouseup', () => setTimeout(() => this.prepareHighlightFromSelection(), 0));
    textLayer.addEventListener('touchend', () => setTimeout(() => this.prepareHighlightFromSelection(), 0));
    scroll.appendChild(pageEl);

    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    await this.renderTextLayer(page, viewport, textLayer, pageNumber, textPages);
    await this.renderPdfAnnotations(page, viewport, pageEl);
    this.renderHighlightsForPage(pageEl, pageNumber);
  },

  async renderTextLayer(page, viewport, textLayer, pageNumber, textPages = this.currentPdfTextPages) {
    textLayer.style.setProperty('--scale-factor', `${viewport.scale}`);
    const textContent = await page.getTextContent();
    textPages[pageNumber] = (textContent.items || []).map(item => item.str || '').join(' ');
    if (window.pdfjsLib?.renderTextLayer) {
      await window.pdfjsLib.renderTextLayer({
        textContentSource: textContent,
        container: textLayer,
        viewport,
        textDivs: []
      }).promise;
      return;
    }

    for (const item of textContent.items || []) {
      const span = document.createElement('span');
      span.textContent = item.str;
      const transform = window.pdfjsLib.Util.transform(viewport.transform, item.transform);
      const fontHeight = Math.hypot(transform[2], transform[3]);
      const angle = Math.atan2(transform[1], transform[0]);
      span.style.left = `${transform[4]}px`;
      span.style.top = `${transform[5] - fontHeight}px`;
      span.style.fontSize = `${fontHeight}px`;
      span.style.transform = `rotate(${angle}rad)`;
      textLayer.appendChild(span);
    }
  },

  async renderPdfAnnotations(page, viewport, pageEl) {
    const layer = pageEl.querySelector('.annotation-layer');
    if (!layer) return;
    layer.innerHTML = '';
    const annotations = await page.getAnnotations({ intent: 'display' }).catch(() => []);
    annotations
      .filter(annotation => annotation.subtype === 'Link' && Array.isArray(annotation.rect))
      .forEach(annotation => {
        const rect = viewport.convertToViewportRectangle(annotation.rect);
        const left = Math.min(rect[0], rect[2]);
        const top = Math.min(rect[1], rect[3]);
        const width = Math.abs(rect[2] - rect[0]);
        const height = Math.abs(rect[3] - rect[1]);
        if (width < 2 || height < 2) return;

        const link = document.createElement(annotation.url ? 'a' : 'button');
        link.className = 'pdf-link-annotation';
        Object.assign(link.style, {
          left: `${left}px`,
          top: `${top}px`,
          width: `${width}px`,
          height: `${height}px`
        });
        link.title = annotation.url ? '打开链接' : '跳转到 PDF 内部位置';
        if (annotation.url) {
          link.href = annotation.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
        } else if (annotation.dest) {
          link.type = 'button';
          link.addEventListener('click', event => {
            event.preventDefault();
            event.stopPropagation();
            this.jumpToPdfDestination(annotation.dest);
          });
        } else {
          return;
        }
        layer.appendChild(link);
      });
  },

  async jumpToPdfDestination(dest) {
    if (!this.currentPdfDoc) return;
    const destination = typeof dest === 'string'
      ? await this.currentPdfDoc.getDestination(dest).catch(() => null)
      : dest;
    if (!Array.isArray(destination) || !destination.length) return;
    let pageIndex = 0;
    try {
      pageIndex = typeof destination[0] === 'object'
        ? await this.currentPdfDoc.getPageIndex(destination[0])
        : Math.max(0, Number(destination[0]) - 1);
    } catch (error) {
      console.warn('Failed to locate PDF destination:', error);
      return;
    }
    const pageNumber = pageIndex + 1;
    const pageEl = document.querySelector(`.pdf-page[data-page="${pageNumber}"]`);
    const scroll = document.getElementById('pdf-scroll');
    if (!pageEl || !scroll) return;

    let targetTop = pageEl.offsetTop - 12;
    let targetLeft = Math.max(0, pageEl.offsetLeft - 24);
    const left = Number(destination[2]);
    const top = Number(destination[3]);
    if (Number.isFinite(left) || Number.isFinite(top)) {
      const page = await this.currentPdfDoc.getPage(pageNumber).catch(() => null);
      if (page) {
        const viewport = page.getViewport({ scale: this.currentPdfScale });
        const point = viewport.convertToViewportPoint(
          Number.isFinite(left) ? left : 0,
          Number.isFinite(top) ? top : page.view[3]
        );
        targetTop = pageEl.offsetTop + point[1] - 64;
        targetLeft = pageEl.offsetLeft + point[0] - 64;
      }
    }
    scroll.scrollTo({
      top: Math.max(0, targetTop),
      left: Math.max(0, targetLeft),
      behavior: 'smooth'
    });
    this.pulsePdfPage(pageNumber);
  },

  renderHighlightsForPage(pageEl, pageNumber) {
    const layer = pageEl.querySelector('.highlight-layer');
    if (!layer) return;
    layer.innerHTML = '';
    const annotations = this.currentReader?.annotations || [];
    annotations.filter(item => item.page === pageNumber).forEach(annotation => {
      const item = document.createElement('div');
      item.className = 'pdf-highlight';
      item.title = '点击删除此高亮';
      item.style.left = `${annotation.x * 100}%`;
      item.style.top = `${annotation.y * 100}%`;
      item.style.width = `${annotation.w * 100}%`;
      item.style.height = `${annotation.h * 100}%`;
      item.style.background = `${annotation.color || '#fde047'}88`;
      item.addEventListener('pointerdown', event => event.stopPropagation());
      item.addEventListener('click', event => this.deleteHighlight(annotation.id, event));
      layer.appendChild(item);
    });
  },

  prepareHighlightFromSelection() {
    if (!this.currentReader) return;
    const built = this.buildSelectionHighlights('#fde047');
    if (!built) {
      this.hideHighlightPopover(false);
      return;
    }
    this.pendingHighlightSelection = built;
    this.positionHighlightPopover(built.anchorRect);
  },

  buildSelectionHighlights(color) {
    const selection = window.getSelection?.();
    if (!selection || selection.isCollapsed || !selection.rangeCount) return null;
    const selectedText = selection.toString().replace(/\s+/g, ' ').trim();
    if (!selectedText) return null;

    const pages = Array.from(document.querySelectorAll('.pdf-page'));
    const rectsByPage = new Map();
    let anchorRect = null;
    for (let i = 0; i < selection.rangeCount; i += 1) {
      const range = selection.getRangeAt(i);
      for (const rect of Array.from(range.getClientRects())) {
        if (rect.width < 1 || rect.height < 4) continue;
        const pageEl = pages.find(page => {
          const pageRect = page.getBoundingClientRect();
          return rect.bottom > pageRect.top && rect.top < pageRect.bottom && rect.right > pageRect.left && rect.left < pageRect.right;
        });
        if (!pageEl) continue;
        const pageRect = pageEl.getBoundingClientRect();
        const left = Math.max(rect.left, pageRect.left) - pageRect.left;
        const top = Math.max(rect.top, pageRect.top) - pageRect.top;
        const right = Math.min(rect.right, pageRect.right) - pageRect.left;
        const bottom = Math.min(rect.bottom, pageRect.bottom) - pageRect.top;
        const width = right - left;
        const height = bottom - top;
        if (width < 1 || height < 4) continue;
        if (!anchorRect || rect.bottom > anchorRect.bottom) anchorRect = rect;
        const pageNumber = Number(pageEl.dataset.page);
        if (!rectsByPage.has(pageNumber)) {
          rectsByPage.set(pageNumber, { pageEl, pageRect, rects: [] });
        }
        rectsByPage.get(pageNumber).rects.push({ left, top, right, bottom, width, height });
      }
    }

    const additions = [];
    const touchedPages = new Set();
    const stamp = Date.now();
    for (const [pageNumber, pageData] of rectsByPage.entries()) {
      const lineRects = this.mergeSelectionRects(pageData.rects);
      for (const rect of lineRects) {
        if (rect.width < 3 || rect.height < 4) continue;
        const annotation = {
          id: `h-${stamp}-${Math.random().toString(36).slice(2, 7)}`,
          type: 'text',
          page: pageNumber,
          x: rect.left / pageData.pageRect.width,
          y: rect.top / pageData.pageRect.height,
          w: rect.width / pageData.pageRect.width,
          h: rect.height / pageData.pageRect.height,
          color,
          text: selectedText.slice(0, 400),
          createdAt: new Date().toISOString()
        };
        if (!this.hasNearDuplicateHighlight(annotation, additions)) {
          additions.push(annotation);
          touchedPages.add(pageNumber);
        }
      }
    }
    if (!additions.length || !anchorRect) return null;
    const selectionKey = additions
      .map(item => `${item.page}:${Math.round(item.x * 1000)}:${Math.round(item.y * 1000)}:${Math.round(item.w * 1000)}:${Math.round(item.h * 1000)}`)
      .join('|');
    if (selectionKey === this.lastSelectionHighlightKey && Date.now() - this.lastSelectionHighlightAt < 900) {
      return null;
    }
    return { additions, touchedPages, selectionKey, anchorRect };
  },

  positionHighlightPopover(anchorRect) {
    const popover = document.getElementById('highlight-popover');
    if (!popover || !anchorRect) return;
    popover.classList.add('open');
    const popoverRect = popover.getBoundingClientRect();
    const left = Math.max(12, Math.min(window.innerWidth - popoverRect.width - 12, anchorRect.left + anchorRect.width / 2 - popoverRect.width / 2));
    const top = Math.max(12, Math.min(window.innerHeight - popoverRect.height - 12, anchorRect.bottom + 8));
    popover.style.left = `${left}px`;
    popover.style.top = `${top}px`;
  },

  hideHighlightPopover(clearSelection = false) {
    const popover = document.getElementById('highlight-popover');
    popover?.classList.remove('open');
    this.pendingHighlightSelection = null;
    if (clearSelection) window.getSelection?.().removeAllRanges();
  },

  async applyPendingHighlight(color) {
    if (!HIGHLIGHT_COLORS.includes(color) || !this.currentReader) return;
    let pending = this.pendingHighlightSelection;
    if (!pending) pending = this.buildSelectionHighlights(color);
    if (!pending) return;
    const additions = pending.additions.map(item => ({ ...item, color }));
    const nextKey = additions
      .map(item => `${item.page}:${Math.round(item.x * 1000)}:${Math.round(item.y * 1000)}:${Math.round(item.w * 1000)}:${Math.round(item.h * 1000)}`)
      .join('|');
    if (nextKey === this.lastSelectionHighlightKey && Date.now() - this.lastSelectionHighlightAt < 900) {
      this.hideHighlightPopover(true);
      return;
    }
    this.highlightColor = color;
    this.lastSelectionHighlightKey = nextKey;
    this.lastSelectionHighlightAt = Date.now();
    this.hideHighlightPopover(true);
    await this.commitReaderAnnotations(
      [...this.currentReader.annotations, ...additions],
      pending.touchedPages
    );
  },

  mergeSelectionRects(rects) {
    const sorted = rects
      .filter(rect => Number.isFinite(rect.left) && Number.isFinite(rect.top))
      .sort((a, b) => (a.top + a.height / 2) - (b.top + b.height / 2) || a.left - b.left);
    const rows = [];
    for (const rect of sorted) {
      const centerY = rect.top + rect.height / 2;
      const row = rows.find(item => Math.abs(item.centerY - centerY) <= Math.max(5, Math.min(item.height, rect.height) * 0.72));
      if (row) {
        row.rects.push(rect);
        row.centerY = (row.centerY * (row.rects.length - 1) + centerY) / row.rects.length;
        row.height = Math.max(row.height, rect.height);
      } else {
        rows.push({ centerY, height: rect.height, rects: [rect] });
      }
    }

    const merged = [];
    rows.forEach(row => {
      row.rects.sort((a, b) => a.left - b.left);
      let current = null;
      row.rects.forEach(rect => {
        if (!current) {
          current = { ...rect };
          return;
        }
        const gap = rect.left - current.right;
        const maxGap = Math.max(8, row.height * 1.4);
        if (gap <= maxGap) {
          current.left = Math.min(current.left, rect.left);
          current.top = Math.min(current.top, rect.top);
          current.right = Math.max(current.right, rect.right);
          current.bottom = Math.max(current.bottom, rect.bottom);
          current.width = current.right - current.left;
          current.height = current.bottom - current.top;
        } else {
          merged.push(current);
          current = { ...rect };
        }
      });
      if (current) merged.push(current);
    });

    return merged.map(rect => {
      const verticalInset = Math.min(2, rect.height * 0.12);
      return {
        left: Math.max(0, rect.left - 1),
        top: Math.max(0, rect.top + verticalInset),
        right: rect.right + 1,
        bottom: Math.max(rect.top + verticalInset + 2, rect.bottom - verticalInset),
        width: rect.width + 2,
        height: Math.max(2, rect.height - verticalInset * 2)
      };
    });
  },

  hasNearDuplicateHighlight(candidate, additions = []) {
    const samePage = [...(this.currentReader?.annotations || []), ...additions]
      .filter(item => item.page === candidate.page && item.type === candidate.type);
    return samePage.some(item => (
      Math.abs(item.x - candidate.x) < 0.003
      && Math.abs(item.y - candidate.y) < 0.003
      && Math.abs(item.w - candidate.w) < 0.004
      && Math.abs(item.h - candidate.h) < 0.004
    ));
  },

  async commitReaderAnnotations(nextAnnotations, touchedPages = null) {
    if (!this.currentReader) return;
    const previous = this.currentReader.annotations.map(item => ({ ...item }));
    const next = nextAnnotations.map(item => ({ ...item }));
    if (JSON.stringify(previous) === JSON.stringify(next)) return;
    this.currentReader.annotations = next;
    this.readerUndoStack.push({ before: previous, after: next });
    if (this.readerUndoStack.length > 60) this.readerUndoStack.shift();
    this.readerRedoStack = [];
    this.renderReaderAnnotationPages(touchedPages);
    this.updateReaderHistoryButtons();
    await this.persistReaderAnnotations();
  },

  renderReaderAnnotationPages(touchedPages = null) {
    const pages = touchedPages && touchedPages.size
      ? [...touchedPages]
      : Array.from(new Set((this.currentReader?.annotations || []).map(item => item.page)));
    pages.forEach(pageNumber => {
      document.querySelectorAll(`.pdf-page[data-page="${pageNumber}"]`).forEach(pageEl => {
        this.renderHighlightsForPage(pageEl, pageNumber);
      });
    });
  },

  async deleteHighlight(id, event) {
    if (event) {
      event.stopPropagation();
      event.preventDefault();
    }
    if (!this.currentReader) return;
    const removed = this.currentReader.annotations.find(item => item.id === id);
    if (!removed) return;
    await this.commitReaderAnnotations(
      this.currentReader.annotations.filter(item => item.id !== id),
      new Set([removed.page])
    );
  },

  async persistReaderAnnotations() {
    if (!this.currentReader) return;
    const next = {
      ...this.currentReader.record,
      annotations: this.currentReader.annotations,
      updatedAt: new Date().toISOString()
    };
    this.currentReader.record = next;
    await this.savePdfRecord(next).catch(error => console.warn('Failed to save annotations:', error));
  },

  async undoReaderAnnotation() {
    if (!this.currentReader || !this.readerUndoStack.length) return;
    const action = this.readerUndoStack.pop();
    this.readerRedoStack.push(action);
    this.currentReader.annotations = action.before.map(item => ({ ...item }));
    this.renderReaderAnnotationPages(new Set([...action.before, ...action.after].map(item => item.page)));
    this.updateReaderHistoryButtons();
    await this.persistReaderAnnotations();
  },

  async redoReaderAnnotation() {
    if (!this.currentReader || !this.readerRedoStack.length) return;
    const action = this.readerRedoStack.pop();
    this.readerUndoStack.push(action);
    this.currentReader.annotations = action.after.map(item => ({ ...item }));
    this.renderReaderAnnotationPages(new Set([...action.before, ...action.after].map(item => item.page)));
    this.updateReaderHistoryButtons();
    await this.persistReaderAnnotations();
  },

  updateReaderHistoryButtons() {
    const undo = document.getElementById('reader-undo-button');
    const redo = document.getElementById('reader-redo-button');
    if (undo) undo.disabled = !this.readerUndoStack.length;
    if (redo) redo.disabled = !this.readerRedoStack.length;
  },

  updateReaderScaleDisplay() {
    const display = document.getElementById('reader-scale-display');
    if (display) display.textContent = `${Math.round(this.currentPdfScale * 100)}%`;
  },

  getReaderScrollAnchor() {
    return this.getReaderZoomAnchor();
  },

  getReaderZoomAnchor(clientX = null, clientY = null) {
    const scroll = document.getElementById('pdf-scroll');
    if (!scroll) return null;
    const scrollRect = scroll.getBoundingClientRect();
    const viewportX = Number.isFinite(clientX) ? clientX - scrollRect.left : scroll.clientWidth / 2;
    const viewportY = Number.isFinite(clientY) ? clientY - scrollRect.top : scroll.clientHeight / 2;
    const contentX = scroll.scrollLeft + viewportX;
    const contentY = scroll.scrollTop + viewportY;
    const pagesHost = scroll.querySelector('.pdf-pages');
    const originX = Math.max(0, contentX - (pagesHost?.offsetLeft || 0));
    const originY = Math.max(0, contentY - (pagesHost?.offsetTop || 0));
    const pages = Array.from(scroll.querySelectorAll('.pdf-page'));
    const pageEl = pages.find(page => (
      contentY >= page.offsetTop
      && contentY <= page.offsetTop + page.offsetHeight
      && contentX >= page.offsetLeft
      && contentX <= page.offsetLeft + page.offsetWidth
    )) || pages.find(page => contentY >= page.offsetTop && contentY <= page.offsetTop + page.offsetHeight) || pages[0];
    if (!pageEl) return null;
    return {
      page: Number(pageEl.dataset.page),
      xRatio: pageEl.offsetWidth ? (contentX - pageEl.offsetLeft) / pageEl.offsetWidth : 0.5,
      yRatio: pageEl.offsetHeight ? (contentY - pageEl.offsetTop) / pageEl.offsetHeight : 0.5,
      viewportX,
      viewportY,
      originX,
      originY
    };
  },

  restoreReaderScrollAnchor(anchor) {
    if (!anchor) return;
    const scroll = document.getElementById('pdf-scroll');
    const pageEl = document.querySelector(`.pdf-page[data-page="${anchor.page}"]`);
    if (!scroll || !pageEl) return;
    const viewportX = Number.isFinite(anchor.viewportX) ? anchor.viewportX : scroll.clientWidth / 2;
    const viewportY = Number.isFinite(anchor.viewportY) ? anchor.viewportY : scroll.clientHeight / 2;
    scroll.scrollTop = Math.max(0, pageEl.offsetTop + pageEl.offsetHeight * anchor.yRatio - viewportY);
    scroll.scrollLeft = Math.max(0, pageEl.offsetLeft + pageEl.offsetWidth * anchor.xRatio - viewportX);
  },

  async zoomReaderPdf(direction) {
    if (!this.currentPdfDoc) return;
    const next = Math.max(0.45, Math.min(4, this.currentPdfScale + direction * 0.15));
    if (Math.abs(next - this.currentPdfScale) < 0.01) return;
    const anchor = this.getReaderZoomAnchor();
    this.currentPdfScale = next;
    await this.renderCurrentPdfPages({ anchor });
  },

  async zoomReaderPdfAt(direction, clientX, clientY, step = 0.15) {
    if (!this.currentPdfDoc) return;
    const next = Math.max(0.45, Math.min(4, this.currentPdfScale + direction * step));
    if (Math.abs(next - this.currentPdfScale) < 0.01) return;
    const anchor = this.getReaderZoomAnchor(clientX, clientY);
    this.currentPdfScale = next;
    await this.renderCurrentPdfPages({ anchor });
  },

  queueReaderZoomAt(direction, clientX, clientY, step = 0.12) {
    if (!this.currentPdfDoc) return;
    const next = Math.max(0.45, Math.min(4, this.currentPdfScale + direction * step));
    if (Math.abs(next - this.currentPdfScale) < 0.01) return;
    const scroll = document.getElementById('pdf-scroll');
    this.readerZoomAnchor = this.getReaderZoomAnchor(clientX, clientY);
    this.readerRenderToken += 1;
    this.currentPdfScale = next;
    this.updateReaderScaleDisplay();
    const previewScale = this.renderedPdfScale ? this.currentPdfScale / this.renderedPdfScale : 1;
    if (this.readerZoomAnchor) {
      scroll.style.setProperty('--pdf-preview-origin', `${this.readerZoomAnchor.originX}px ${this.readerZoomAnchor.originY}px`);
    }
    scroll.style.setProperty('--pdf-preview-scale', String(previewScale));
    scroll.classList.add('zoom-preview');
    clearTimeout(this.readerZoomTimer);
    this.readerZoomTimer = setTimeout(async () => {
      const anchor = this.readerZoomAnchor;
      this.readerZoomTimer = null;
      await this.renderCurrentPdfPages({ anchor });
    }, 180);
  },

  handleReaderWheel(event) {
    if (!this.currentPdfDoc || this.readerView !== 'pdf') return;
    if (!event.ctrlKey && !event.metaKey) return;
    event.preventDefault();
    this.hideHighlightPopover(false);
    const direction = event.deltaY < 0 ? 1 : -1;
    const step = Math.min(0.24, Math.max(0.08, Math.abs(event.deltaY) / 650));
    this.queueReaderZoomAt(direction, event.clientX, event.clientY, step);
  },

  startReaderGestureZoom(event) {
    if (!this.currentPdfDoc || this.readerView !== 'pdf') return;
    event.preventDefault();
    this.readerGestureScaleStart = this.currentPdfScale;
    this.readerGestureAnchor = this.getReaderZoomAnchor(event.clientX, event.clientY);
  },

  changeReaderGestureZoom(event) {
    if (!this.currentPdfDoc || this.readerView !== 'pdf') return;
    event.preventDefault();
    const next = Math.max(0.45, Math.min(4, this.readerGestureScaleStart * (event.scale || 1)));
    if (Math.abs(next - this.currentPdfScale) < 0.01) return;
    const scroll = document.getElementById('pdf-scroll');
    this.readerRenderToken += 1;
    this.currentPdfScale = next;
    this.updateReaderScaleDisplay();
    const previewScale = this.renderedPdfScale ? this.currentPdfScale / this.renderedPdfScale : 1;
    if (this.readerGestureAnchor) {
      scroll.style.setProperty('--pdf-preview-origin', `${this.readerGestureAnchor.originX}px ${this.readerGestureAnchor.originY}px`);
    }
    scroll.style.setProperty('--pdf-preview-scale', String(previewScale));
    scroll.classList.add('zoom-preview');
    clearTimeout(this.readerZoomTimer);
    this.readerZoomTimer = setTimeout(async () => {
      this.readerZoomTimer = null;
      await this.renderCurrentPdfPages({ anchor: this.readerGestureAnchor });
    }, 180);
  },

  async fitReaderPdf() {
    if (!this.currentPdfDoc) return;
    await this.renderCurrentPdfPages({ fitWidth: true, preserveAnchor: true });
  },

  async fitReaderPdfPage() {
    if (!this.currentPdfDoc) return;
    await this.renderCurrentPdfPages({ fitPage: true, preserveAnchor: true });
  },

  scrollReaderBy(left, top) {
    const scroll = document.getElementById('pdf-scroll');
    if (!scroll) return;
    scroll.scrollBy({ left, top, behavior: 'smooth' });
  },

  captureReaderReturnState() {
    if (!this.currentReader) return null;
    return {
      scope: this.currentReader.scope,
      id: this.currentReader.id,
      scale: this.currentPdfScale,
      anchor: this.getReaderZoomAnchor(),
      outlineCollapsed: this.readerOutlineCollapsed,
      outlineExpanded: [...this.readerOutlineExpanded],
      timestamp: Date.now()
    };
  },

  async returnToReaderPreview() {
    const state = this.readerReturnState;
    if (!state) return;
    this.readerReturnState = null;
    this.closeModal();
    await this.openPdfReader(state.scope, state.id, null, { restoreState: state });
  },

  openReaderLinkedRecord(event) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }
    const state = this.captureReaderReturnState();
    if (!state) return;
    this.readerReturnState = state;
    const { scope, id } = state;
    this.closePdfReader();
    if (scope === 'todo') this.openTodoEditor(id);
    else this.openDetail(id);
  },

  downloadReaderPdf(event) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }
    const record = this.currentReader?.record;
    const blob = record?.blob;
    if (!blob) {
      alert('PDF 还没有加载完成。');
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = this.safeDownloadFileName(record.fileName || `${this.currentReader?.paper?.title || 'paper'}.pdf`);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  },

  safeDownloadFileName(name) {
    const value = String(name || 'paper.pdf').replace(/[\\/:*?"<>|]+/g, '_').trim() || 'paper.pdf';
    return value.toLowerCase().endsWith('.pdf') ? value : `${value}.pdf`;
  },

  startReaderPan(event) {
    const readerOpen = document.getElementById('reader-overlay').classList.contains('open');
    if (!readerOpen || this.readerView !== 'pdf' || event.button !== 0) return;
    if (event.target.closest?.('button, a, input, .pdf-highlight, .text-layer span')) return;
    const scroll = document.getElementById('pdf-scroll');
    event.preventDefault();
    this.hideHighlightPopover(false);
    try {
      scroll.setPointerCapture?.(event.pointerId);
    } catch (_) {}
    scroll.classList.add('panning');
    this.readerPanState = {
      pointerId: event.pointerId,
      x: event.clientX,
      y: event.clientY,
      left: scroll.scrollLeft,
      top: scroll.scrollTop,
      move: null,
      up: null
    };
    this.readerPanState.move = e => this.moveReaderPan(e);
    this.readerPanState.up = e => this.stopReaderPan(e);
    document.addEventListener('pointermove', this.readerPanState.move);
    document.addEventListener('pointerup', this.readerPanState.up, { once: true });
  },

  moveReaderPan(event) {
    if (!this.readerPanState) return;
    const scroll = document.getElementById('pdf-scroll');
    scroll.scrollLeft = this.readerPanState.left - (event.clientX - this.readerPanState.x);
    scroll.scrollTop = this.readerPanState.top - (event.clientY - this.readerPanState.y);
  },

  stopReaderPan(event) {
    if (!this.readerPanState) return;
    document.removeEventListener('pointermove', this.readerPanState.move);
    const scroll = document.getElementById('pdf-scroll');
    try {
      scroll.releasePointerCapture?.(this.readerPanState.pointerId || event.pointerId);
    } catch (_) {}
    scroll.classList.remove('panning');
    this.readerPanState = null;
  },

  selectAllReaderText() {
    const textLayers = Array.from(document.querySelectorAll('.pdf-page .text-layer'));
    if (!textLayers.length) return;
    const first = textLayers[0];
    const last = textLayers[textLayers.length - 1];
    const range = document.createRange();
    range.setStartBefore(first);
    range.setEndAfter(last);
    const selection = window.getSelection?.();
    if (!selection) return;
    selection.removeAllRanges();
    selection.addRange(range);
  },

  handleCitationInput(event) {
    if (event.key === 'Enter') {
      event.preventDefault();
      this.locatePdfCitation();
    }
  },

  normalizePdfSearchText(value) {
    return String(value || '').replace(/\s+/g, ' ').trim().toLowerCase();
  },

  async locatePdfCitation() {
    if (!this.currentPdfDoc) return;
    const input = document.getElementById('citation-jump-input');
    const raw = input?.value || '';
    const query = this.normalizePdfSearchText(raw);
    if (!query) return;
    const number = Number.parseInt(query.replace(/[^\d]/g, ''), 10);
    const tokens = [query];
    if (Number.isFinite(number)) {
      tokens.push(`[${number}]`, `(${number})`, `${number}.`);
    }
    const normalizedTokens = [...new Set(tokens.map(item => this.normalizePdfSearchText(item)).filter(Boolean))];

    let pageNumber = 0;
    for (let i = 1; i < this.currentPdfTextPages.length; i += 1) {
      const pageText = this.normalizePdfSearchText(this.currentPdfTextPages[i]);
      if (normalizedTokens.some(token => pageText.includes(token))) {
        pageNumber = i;
        break;
      }
    }
    if (!pageNumber && Number.isFinite(number) && number >= 1 && number <= this.currentPdfDoc.numPages) {
      pageNumber = number;
    }
    if (!pageNumber) {
      alert('没有在 PDF 中找到这个引用或页码。');
      return;
    }
    this.scrollToPdfPage(pageNumber);
    this.pulsePdfCitationMatch(pageNumber, normalizedTokens);
  },

  scrollToPdfPage(pageNumber) {
    const scroll = document.getElementById('pdf-scroll');
    const pageEl = document.querySelector(`.pdf-page[data-page="${pageNumber}"]`);
    if (!scroll || !pageEl) return;
    scroll.scrollTo({
      top: Math.max(0, pageEl.offsetTop - 12),
      left: Math.max(0, pageEl.offsetLeft - 24),
      behavior: 'smooth'
    });
  },

  pulsePdfCitationMatch(pageNumber, tokens) {
    const pageEl = document.querySelector(`.pdf-page[data-page="${pageNumber}"]`);
    if (!pageEl) return;
    pageEl.querySelectorAll('.pdf-search-pulse').forEach(item => item.remove());
    const spans = Array.from(pageEl.querySelectorAll('.text-layer span'));
    const match = spans.find(span => {
      const text = this.normalizePdfSearchText(span.textContent);
      return tokens.some(token => text.includes(token));
    });
    if (match) {
      const pageRect = pageEl.getBoundingClientRect();
      const rect = match.getBoundingClientRect();
      this.addPdfPulse(pageEl, {
        left: rect.left - pageRect.left - 2,
        top: rect.top - pageRect.top - 2,
        width: rect.width + 4,
        height: rect.height + 4
      });
    } else {
      this.pulsePdfPage(pageNumber);
    }
  },

  pulsePdfPage(pageNumber) {
    const pageEl = document.querySelector(`.pdf-page[data-page="${pageNumber}"]`);
    if (!pageEl) return;
    this.addPdfPulse(pageEl, {
      left: 12,
      top: 12,
      width: Math.max(80, pageEl.offsetWidth - 24),
      height: 48
    });
  },

  addPdfPulse(pageEl, rect) {
    const pulse = document.createElement('div');
    pulse.className = 'pdf-search-pulse';
    Object.assign(pulse.style, {
      left: `${Math.max(0, rect.left)}px`,
      top: `${Math.max(0, rect.top)}px`,
      width: `${Math.max(8, rect.width)}px`,
      height: `${Math.max(8, rect.height)}px`
    });
    pageEl.appendChild(pulse);
    setTimeout(() => pulse.remove(), 2400);
  },

  toggleReaderView() {
    this.setReaderView(this.readerView === 'pdf' ? 'record' : 'pdf');
  },
