  setReaderView(view) {
    this.readerView = view === 'record' ? 'record' : 'pdf';
    const body = document.getElementById('reader-body');
    body?.classList.toggle('mode-record', this.readerView === 'record');
    body?.classList.toggle('mode-pdf', this.readerView !== 'record');
    const toggle = document.getElementById('reader-view-toggle');
    if (toggle) toggle.textContent = this.readerView === 'record' ? '返回PDF' : '文献详情';
    const fitButton = document.getElementById('fit-reader-button');
    if (fitButton) fitButton.style.display = this.readerView === 'record' ? 'none' : '';
  },

  closePdfReader() {
    this.readerRenderToken += 1;
    document.getElementById('reader-overlay').classList.remove('open');
    const scroll = document.getElementById('pdf-scroll');
    scroll.classList.remove('panning', 'zoom-preview');
    scroll.style.removeProperty('--pdf-preview-scale');
    scroll.style.removeProperty('--pdf-preview-origin');
    scroll.innerHTML = '';
    this.currentReader = null;
    this.currentPdfDoc = null;
    this.renderedPdfScale = 1.25;
    this.currentPdfTextPages = [];
    this.readerPanState = null;
    this.readerOutlineItems = [];
    this.pendingHighlightSelection = null;
    this.readerZoomAnchor = null;
    this.readerRestoreState = null;
    clearTimeout(this.readerZoomTimer);
    this.readerZoomTimer = null;
    this.readerUndoStack = [];
    this.readerRedoStack = [];
    this.lastSelectionHighlightKey = '';
    this.hideHighlightPopover(true);
    this.updateReaderHistoryButtons();
    this.setReaderView('pdf');
  },

  formatFileSize(bytes) {
    const size = Number(bytes) || 0;
    if (size < 1024) return `${size} B`;
    if (size < 1024 * 1024) return `${Math.round(size / 1024)} KB`;
    return `${(size / 1024 / 1024).toFixed(1)} MB`;
  },

  // ===================== Rating Standard =====================
  renderRating() {

  },

  // ===================== PPT Template =====================
  renderPPT() {
    return `
      <div class="fade-in">

        <div class="page-desc">文献分享时的推荐结构</div>

          <h3>第1页：为什么值得读？</h3>

          <h3>第3页：实验是否可信？对我们有什么启发？</h3>

  // ===================== Import / Export =====================
  async exportData() {
    try {
      const data = await apiGet('/api/export');
      const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `embodied_papers_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    } catch(e) {
      alert('导出失败: ' + e.message);
    }
  },

  async importData(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.papers && Array.isArray(data.papers)) {
          const incomingIds = new Set(data.papers.map(p => p.id).filter(Boolean));
          const duplicates = this.papers.filter(p => incomingIds.has(p.id)).length;
          let mode = 'skip';
          if (duplicates > 0) {
            const overwrite = confirm(`即将导入 ${data.papers.length} 篇文献，其中 ${duplicates} 篇与现有记录 ID 重复。\n\n点“确定”会覆盖重复记录；点“取消”会跳过重复记录。`);
            mode = overwrite ? 'upsert' : 'skip';
          } else if (!confirm(`确认导入 ${data.papers.length} 篇文献？`)) {
            input.value = '';
            return;
          }
          const result = await apiPost('/api/import', {...data, mode});
          await this.loadData();
          this.saveData();
          this.render();
          alert(`导入完成：新增 ${result.imported || 0} 篇，更新 ${result.updated || 0} 篇，跳过 ${result.skipped || 0} 篇。`);
        } else {
          alert('文件格式不正确');
        }
      } catch(err) {
        alert('导入失败：' + err.message);
      }
      input.value = '';
    };
    reader.readAsText(file);
  },

  pickPdfForPaper(id, event) {
    if (event) event.stopPropagation();
    this.pendingPdfImportPaperId = id;
    this.pendingPdfImportTodoId = '';
    const input = document.getElementById('pdf-import-file');
    if (input) input.click();
  },

  pickPdfForTodo(id, event) {
    if (event) event.stopPropagation();
    this.pendingPdfImportTodoId = id;
    this.pendingPdfImportPaperId = '';
    const input = document.getElementById('pdf-import-file');
    if (input) input.click();
  },

  handleCardDragOver(event) {
    const hasFile = Array.from(event.dataTransfer?.items || []).some(item => item.kind === 'file')
      || Array.from(event.dataTransfer?.types || []).includes('Files');
    if (!hasFile) return;
    event.preventDefault();
    event.currentTarget.classList.add('drag-over');
  },

  handleCardDragLeave(event) {
    event.currentTarget.classList.remove('drag-over');
  },

  async handlePdfDrop(event, scope, id) {
    event.preventDefault();
    event.stopPropagation();
    event.currentTarget.classList.remove('drag-over');
    const file = Array.from(event.dataTransfer?.files || []).find(candidate => (
      candidate.type === 'application/pdf' || /\.pdf$/i.test(candidate.name)
    ));
    if (!file) {
      alert('请拖入 PDF 文件。');
      return;
    }
    await this.bindPdfToRecord(scope, id, file);
  },

  async importPdfFile(input) {
    const file = input.files[0];
    if (!file) return;
    if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') {
      alert('请选择 PDF 文件。');
      input.value = '';
      return;
    }

    try {
      const targetId = this.pendingPdfImportPaperId || '';
      const targetTodoId = this.pendingPdfImportTodoId || '';
      this.pendingPdfImportPaperId = '';
      this.pendingPdfImportTodoId = '';
      if (targetId) {
        await this.bindPdfToRecord('paper', targetId, file);
      } else if (targetTodoId) {
        await this.bindPdfToRecord('todo', targetTodoId, file);
      } else {
        const draft = await this.createPaperDraftFromPdf(file);
        this.openEditor(null, draft);
        this.setSaveStatus('已从 PDF 生成草稿，请检查后保存', 'dirty');
        this.formDirty = true;
      }
    } catch (err) {
      alert('导入 PDF 失败：' + err.message);
    } finally {
      this.pendingPdfImportPaperId = '';
      this.pendingPdfImportTodoId = '';
      input.value = '';
    }
  },

  async bindPdfToRecord(scope, id, file) {
    if (!this.pdfDb) {
      alert('PDF 存储服务暂不可用，无法绑定 PDF。');
      return;
    }
    const draft = await this.createPaperDraftFromPdf(file);
    const form = new FormData();
    form.append('file', file, file.name);
    await apiPostForm(`/api/pdfs/${encodeURIComponent(scope)}/${encodeURIComponent(id)}`, form);
    await this.loadPdfIndex();
    this.render();
    if (scope === 'todo') {
      this.openTodoEditor(id, draft);
      this.setSaveStatus('已绑定 PDF 并补全待办信息，请检查后保存', 'dirty');
    } else {
      this.openEditor(id, draft);
      this.setSaveStatus('已绑定 PDF 并补全文献信息，请检查后保存', 'dirty');
    }
    this.formDirty = true;
  },

  mergePdfDraftIntoPaper(paper, draft) {
    const next = { ...paper };
    ['title', 'authors', 'doi', 'arxiv_id', 'canonical_url', 'link', 'source'].forEach(key => {
      if (!String(next[key] || '').trim() && String(draft[key] || '').trim()) {
        next[key] = draft[key];
      }
    });
    next.metadata_source = draft.metadata_source || next.metadata_source || '';
    next.metadata_checked_at = draft.metadata_checked_at || next.metadata_checked_at || '';
    next.tags = parseList([...(parseList(next.tags)), ...(parseList(draft.tags))]);
    return next;
  },

  async createPaperDraftFromPdf(file) {
    const fallbackTitle = file.name.replace(/\.pdf$/i, '').replace(/[_-]+/g, ' ').trim();
    const buffer = await file.arrayBuffer();
    const text = this.decodePdfPreview(buffer);
    const title = this.cleanPdfText(this.findPdfInfoValue(text, 'Title')) || fallbackTitle;
    const authors = this.cleanPdfText(this.findPdfInfoValue(text, 'Author'));
    const doi = this.findDoi(text);
    const arxivId = this.findArxivId(text) || this.findArxivId(file.name);
    const canonicalUrl = doi
      ? `https://doi.org/${doi}`
      : (arxivId ? `https://arxiv.org/abs/${arxivId}` : '');

    return {
      title,
      authors,
      source: `PDF：${file.name}`,
      link: canonicalUrl,
      canonical_url: canonicalUrl,
      doi,
      arxiv_id: arxivId,
      metadata_source: 'pdf',
      metadata_checked_at: new Date().toISOString(),
      status: '未读',
      recorder: this.getMemberName(false) || this.currentUser || localStorage.getItem('embodied_member_name') || '',
      tags: ['PDF导入']
    };
  },

  decodePdfPreview(buffer) {
    const limit = Math.min(buffer.byteLength, 2 * 1024 * 1024);
    const bytes = new Uint8Array(buffer.slice(0, limit));
    try {
      return new TextDecoder('latin1').decode(bytes);
    } catch {
      return Array.from(bytes, byte => String.fromCharCode(byte)).join('');
    }
  },

  findPdfInfoValue(text, key) {
    const escapedKey = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const match = text.match(new RegExp(`/${escapedKey}\\s*\\(([^)]{1,500})\\)`));
    return match ? match[1] : '';
  },

  cleanPdfText(value) {
    return String(value || '')
      .replace(/\\([()\\])/g, '$1')
      .replace(/\\r|\\n/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  },

  findDoi(text) {
    const match = String(text || '').match(/\b10\.\d{4,9}\/[-._;()/:A-Z0-9]+\b/i);
    return match ? match[0].replace(/[).,;]+$/g, '') : '';
  },

  findArxivId(text) {
    const match = String(text || '').match(/\b(?:arXiv:)?(\d{4}\.\d{4,5}(?:v\d+)?|[a-z-]+(?:\.[A-Z]{2})?\/\d{7}(?:v\d+)?)\b/i);
    return match ? match[1] : '';
  },

  async backfillMetadata() {
    const scope = this.currentView === 'todos' ? 'todos' : 'papers';
    const targetLabel = scope === 'todos' ? '待办论文' : '文献库';
    const overwrite = confirm(`批量补全${targetLabel}默认只填空值。\n\n点“确定”：重新刷新已有发表时间和引用量。\n点“取消”：只补全空缺字段。`);
    const proceed = confirm(`将${overwrite ? '刷新' : '补全'}最多 100 篇${targetLabel}里的论文发表时间、引用量、DOI/arXiv 等事实元数据。过程可能需要几十秒，继续吗？`);
    if (!proceed) return;

    const btn = document.getElementById('backfill-metadata-button');
    const originalText = btn?.innerHTML || '';
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '补全中...';
    }

    try {
      const result = await apiPost('/api/metadata/backfill', {
        overwrite,
        scope,
        limit: 100
      });
      await this.loadData();
      this.saveData();
      this.render();
      alert(`${targetLabel}补全完成：扫描 ${result.scanned || 0} 篇，更新 ${result.updated || 0} 篇，未匹配 ${result.noCandidate || 0} 篇，失败 ${result.failed || 0} 篇。\n\n如果仍有缺失，可以再次点击补全元数据。`);
    } catch(e) {
      alert('批量补全失败：' + e.message);
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }
  },

  // ===================== Utils =====================
  escape(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  },
  escapeJs(str) {
    return String(str || '')
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/\n/g, '\\n')
      .replace(/\r/g, '\\r');
  },
  formatChinaTime(value) {
    if (!value) return '';
    const normalized = String(value);
    const date = new Date(normalized.includes('T') ? normalized : normalized.replace(' ', 'T'));
    if (Number.isNaN(date.getTime())) return normalized;
    return new Intl.DateTimeFormat('zh-CN', {
      timeZone: 'Asia/Shanghai',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    }).format(date).replace(/\//g, '-');
  },
  formatDateOnly(value) {
    if (!value) return '';
    const normalized = String(value).trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(normalized)) return normalized.slice(0, 10);
    const date = new Date(normalized.includes('T') ? normalized : normalized.replace(' ', 'T'));
    if (Number.isNaN(date.getTime())) return normalized;
    return new Intl.DateTimeFormat('zh-CN', {
      timeZone: 'Asia/Shanghai',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    }).format(date).replace(/\//g, '-');
  },
  formatMetadataValue(key, value) {
    if (key === 'metadata_checked_at') return this.formatChinaTime(value);
    if (key === 'published_at') return String(value || '').slice(0, 10);
    if (key === 'citation_count') return formatCitationCount(value);
    return value || '';
  },
  nl2br(str) {
    return str.replace(/\n/g, '<br>');
  }
};

// Initialize
document.addEventListener('DOMContentLoaded', () => app.init());
</script>
